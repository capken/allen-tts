name: release

# 推 v* tag 时自动发布；也可手动重跑一个已存在的 tag。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '已存在的 tag，例如 v0.1.0'
        required: true

permissions:
  contents: write

env:
  GO_VERSION: '1.24'

jobs:
  test:
    name: 测试门禁
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go vet ./...
      - run: go test ./...

  release:
    name: 构建并发布
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: 交叉编译四个平台
        env:
          VERSION: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            echo "==> ${os}/${arch}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build \
              -trimpath \
              -ldflags "-s -w -X github.com/capken/allen-tts/internal/version.Version=${VERSION}" \
              -o dist/allen-tts ./cmd/allen-tts
            tar -C dist -czf "dist/allen-tts_${VERSION}_${os}_${arch}.tar.gz" allen-tts
            rm dist/allen-tts
          done
          cd dist && sha256sum ./*.tar.gz > checksums.txt && cat checksums.txt

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # 重跑同一个 tag 时覆盖产物，而不是失败。
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" dist/*.tar.gz dist/checksums.txt --clobber
          else
            gh release create "$VERSION" dist/*.tar.gz dist/checksums.txt \
              --title "$VERSION" --generate-notes
          fi
